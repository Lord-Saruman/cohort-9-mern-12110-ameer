services:
  mysql:
    image: mysql:8.4
    container_name: notes-app-mysql
    environment:
      MYSQL_DATABASE: notes_app
      MYSQL_USER: notes_user
      MYSQL_PASSWORD: change_me_local
      MYSQL_ROOT_PASSWORD: change_me_root
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/api/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
